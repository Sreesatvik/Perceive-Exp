<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Perceive</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #eaeaea;
    }
    h1 { font-size: 15px; margin: 0 0 8px 0; }
    p { font-size: 12px; color: #aaa; margin: 0 0 12px 0; line-height: 1.4; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 60px;
      background: #262626;
      color: #eaeaea;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 8px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #218838; }
    #dashboard-btn { background: #2a2d33; margin-top: 6px; font-size: 11px; padding: 6px; }
    #dashboard-btn:hover { background: #34373d; }
    .status {
      font-size: 11px;
      padding: 6px 8px;
      background: #262626;
      border-radius: 4px;
      color: #7fd77f;
      margin-top: 8px;
    }
    details {
      margin-top: 10px;
      font-size: 11px;
      color: #999;
    }
    summary {
      cursor: pointer;
      user-select: none;
    }
    #api-key-input {
      width: 100%;
      box-sizing: border-box;
      background: #262626;
      color: #eaeaea;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
      margin-top: 6px;
    }
    #save-key-btn {
      margin-top: 6px;
      background: #2a2d33;
      font-size: 11px;
      padding: 6px;
    }
    #save-key-btn:hover { background: #34373d; }
    #key-status { margin-top: 4px; color: #7fd77f; }
    #show-detected-values-btn {
      background: #2a2d33;
      margin-top: 6px;
      font-size: 11px;
      padding: 6px;
    }
    #show-detected-values-btn:hover { background: #34373d; }
    #detected-values-result {
      margin-top: 8px;
      font-size: 11px;
      color: #eaeaea;
      background: #262626;
      border-radius: 4px;
      padding: 8px;
    }
    #detected-values-result:empty { display: none; }
    #detected-values-result .detected-value-line {
      padding: 3px 0;
      border-bottom: 1px solid #3a3a3a;
      word-break: break-word;
    }
    #detected-values-result .detected-value-line:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <h1>Perceive</h1>
  <p>Privacy-preserving on-device redaction for AI browser agents.</p>
  <textarea id="task-input" placeholder="e.g. Log in with username 'tomsmith' and password 'SuperSecretPassword!'"></textarea>
  <button id="run-btn">Run Task</button>
  <button id="dashboard-btn">Open audit dashboard</button>
  <div class="status" id="status">● Extension active</div>
  <!--
    Local-only on-screen value relay (separate feature from Run Task
    above). Explicit, opt-in only: clicking this is the ONLY thing that
    triggers GET_DETECTED_VALUES — it never fires during RUN_TASK or any
    other flow. Shows whatever the vision/OCR channel most recently read
    off the current page (e.g. a canvas-rendered balance with no DOM
    presence) DIRECTLY in this popup; never sent to the backend/LLM — see
    orchestrator.js's `lastDetectedValues` for the full separation
    guarantee this relies on.
  -->
  <button id="show-detected-values-btn">Show detected value</button>
  <div id="detected-values-result"></div>
  <details id="settings-details">
    <summary>Backend settings</summary>
    <input type="password" id="api-key-input" placeholder="Backend API key (X-API-Key)">
    <button id="save-key-btn">Save key</button>
    <div id="key-status"></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
